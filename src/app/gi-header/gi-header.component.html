<nav class="navbar navbar-default header header-nav">
  <div class="container-fluid header header-content">
    <button
      class="menu-toggle"
      type="button"
      [attr.aria-label]="language.current === 'en' ? 'Open or close menu' : 'Menü öffnen oder schließen'"
      aria-controls="main-menu"
      [attr.aria-expanded]="menuOpen"
      (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <ul id="main-menu" class="nav navbar-nav header main-menu" [class.is-open]="menuOpen">
      <li><a href="#/home" (click)="closeMenu()"><span [ngClass]="getClass('home')">HOME</span></a></li>
      <li><a href="#/ueberuns" (click)="closeMenu()"><span [ngClass]="getClass('ueberuns')">{{ language.current === 'en' ? 'ABOUT US' : 'ÜBER UNS' }}</span></a></li>
      <li><a href="#/portrait" (click)="closeMenu()"><span [ngClass]="getClass('portrait')">PORTRAIT</span></a></li>
      <li><a href="#/projekte" (click)="closeMenu()"><span [ngClass]="getClass('projekte')">{{ language.current === 'en' ? 'PROJECTS' : 'PROJEKTE' }}</span></a></li>
      <li><a href="#/kontakt" (click)="closeMenu()"><span [ngClass]="getClass('kontakt')">{{ language.current === 'en' ? 'CONTACT' : 'KONTAKT' }}</span></a></li>
    </ul>
    <div class="language-switch" aria-label="Language"><button type="button" [attr.aria-pressed]="language.current === 'de'" (click)="language.set('de')">DE</button><span aria-hidden="true">/</span><button type="button" [attr.aria-pressed]="language.current === 'en'" (click)="language.set('en')">EN</button></div>
    <a class="brand-link" href="#/home" [attr.aria-label]="language.current === 'en' ? 'Back to home page' : 'Zurück zur Startseite'">
      <img src="assets/images/bilder/gargerinvest_schriftzug.png" alt="Garger Investment GmbH">
    </a>
    <a class="todo-button" href="#/todo" (click)="closeMenu()" [attr.aria-current]="getClass('todo') === 'gspmenuitem-active' ? 'page' : null">TODO</a>
  </div>
</nav>
